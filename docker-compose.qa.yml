version: '3.8'
name: matchmaking-qa

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "29092:29092"

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-init
    container_name: kafka-init
    depends_on:
      - kafka
    command:
      - bash
      - -c
      - |
        echo "Waiting for Kafka to be fully ready (10s delay)..."
        sleep 10

        BROKER="kafka:9092"
        PARTITIONS=3
        REPLICATION_FACTOR=1

        echo "Creating topic matchmaking.request..."
        kafka-topics --bootstrap-server $$BROKER --create --if-not-exists --topic matchmaking-request --partitions $$PARTITIONS --replication-factor $$REPLICATION_FACTOR

        echo "Creating topic matchmaking.complete..."
        kafka-topics --bootstrap-server $$BROKER --create --if-not-exists --topic matchmaking-complete --partitions $$PARTITIONS --replication-factor $$REPLICATION_FACTOR

        echo "All initial topics created."